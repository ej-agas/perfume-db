{{- define "house-card" -}}
<div class="inline-block px-3">
    <div 
        hx-get="/houses/{{.Slug}}"
        hx-target="main"
        hx-push-url="true"
        hx-swap="innerHTML"
        class="bg-white p-6 rounded-lg w-64 h-64 max-w-xs overflow-hidden shadow-md hover:shadow-xl transition-shadow duration-300 ease-in-out cursor-pointer"
    >
        <h2 class="text-lg font-semibold mb-2 text-gray-800">{{.Name}}</h2>
        <div class="text-sm text-gray-600 mb-2">{{.Country}}</div>
        <div class="text-xs text-gray-400 mt-auto">{{.FoundedAt.Year}}</div>
    </div>
</div>
{{end}}
