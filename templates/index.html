{{define "content"}}
<div class="container mx-auto px-4 py-8">
    <div class="flex flex-col bg-white m-auto p-auto">
        <h1 class="flex py-5 lg:px-20 md:px-10 px-5 lg:mx-40 md:mx-20 mx-5 font-bold text-4xl text-gray-800">Featured Houses</h1>
        <div class="flex overflow-x-scroll pb-10 hide-scroll-bar">
            <div class="flex flex-nowrap lg:ml-40 md:ml-20 ml-10 ">
            <div id="houses-loading" class="flex overflow-x-scroll pb-10 hide-scroll-bar">
                <div class="flex flex-nowrap lg:ml-40 md:ml-20 ml-10">
                    {{- range $i, $e := makeSlice 5 -}}
                    <div class="inline-block px-3">
                        <div class="w-64 h-64 overflow-hidden rounded-lg shadow-md bg-white hover:shadow-xl transition-shadow duration-300 ease-in-out">
                            <div class="animate-pulse w-full h-full p-4">
                                <div class="h-6 bg-gray-200 rounded w-3/4 mb-4"></div>
                                <div class="h-4 bg-gray-100 rounded w-1/2 mb-3"></div>
                                <div class="h-3 bg-gray-100 rounded w-full mb-2"></div>
                                <div class="h-3 bg-gray-100 rounded w-5/6"></div>
                            </div>
                        </div>
                    </div>
                    {{- end -}}
                </div>
            </div>
                <div id="houses-container"
                     class="flex overflow-x-scroll pb-10 hide-scroll-bar"
                     hx-get="/ui/houses"
                     hx-trigger="load"
                     hx-target="#houses-loading"
                     hx-swap="outerHTML">
                    <!-- Content will be replaced by HTMX -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<template x-teleport="body">
    <div 
        x-show="$store.modal.open()"
        x-transition:enter="transition ease-out duration-50"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-25"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-50"
        @click="$store.modal.close()"
    >
        <div 
            class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto"
            @click.stop
            x-trap.noscroll.inert="$store.modal.open"
        >
            <div id="modal-content" class="p-6">
                <!-- Modal content will be loaded here -->
            </div>
        </div>
    </div>
</template>

<script>
// Houses scrolling functionality
function scrollHouses(direction) {
    const container = document.getElementById('houses-container');
    if (!container) return;
    
    const scrollAmount = 300; // Adjust this value to control scroll distance
    
    if (direction === 'left') {
        container.scrollBy({
            left: -scrollAmount,
            behavior: 'smooth'
        });
    } else {
        container.scrollBy({
            left: scrollAmount,
            behavior: 'smooth'
        });
    }
}
</script>
{{end}}
